name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Hardware
        run: nproc; free -h; df -h / /mnt; lscpu | grep -E "Model name|avx512f" | head -3; python3 --version
      - name: sd.cpp + models
        run: |
          mkdir -p /mnt/m && sudo chown $USER /mnt/m && cd /mnt/m
          gh release download master-1106-532d2c1 -R leejet/stable-diffusion.cpp -p 'sd-master-532d2c1-bin-Linux-Ubuntu-26.04-x86_64.zip' && unzip -q *.zip -d sd && find sd -name sd-cli
          H=https://huggingface.co
          curl -sSfL -o dit.gguf $H/leejet/FLUX.2-klein-4B-GGUF/resolve/main/flux-2-klein-4b-Q8_0.gguf &
          curl -sSfL -o llm.gguf $H/unsloth/Qwen3-4B-GGUF/resolve/main/Qwen3-4B-Q8_0.gguf &
          curl -sSfL -o vae.safetensors $H/black-forest-labs/FLUX.2-klein-4B/resolve/main/vae/diffusion_pytorch_model.safetensors &
          curl -sSfL -o up.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.2.4/RealESRGAN_x4plus_anime_6B.pth &
          wait; ls -la
        env: { GH_TOKEN: "${{ github.token }}" }
      - name: Generate
        run: |
          cd /mnt/m; SD=$(find sd -name sd-cli); chmod +x $SD
          base="$SD --diffusion-model dit.gguf --vae vae.safetensors --llm llm.gguf --cfg-scale 1.0 --sampling-method euler --steps 4 -t $(nproc) --flash-attn on"
          P="Comic book splash page art, bold black ink linework, cel shading, halftone dot texture, dramatic cinematic lighting. A colossal armored cosmic giant in purple and blue armor with a tall pronged helmet stands in deep space devouring a burning planet, tiny silver humanoid on a surfboard in the foreground, epic scale, Jack Kirby inspired cosmic energy crackle"
          /usr/bin/time -v $base -W 1344 -H 768 -s 42 -p "$P" -o a.png 2>&1 | grep -E "Elapsed|Maximum resident|sampling completed|decode|error|ERROR" || true
          /usr/bin/time -v $base -W 1344 -H 768 -s 7 -r a.png -p "The same cosmic giant from the reference image, close-up portrait of his face under the pronged helmet, glowing eyes, looking down with ancient hunger. Comic book art, bold ink, halftone" -o b.png 2>&1 | grep -E "Elapsed|Maximum resident|error|ERROR" || true
          /usr/bin/time -v $base -W 1024 -H 576 -s 42 -p "$P" --upscale-model up.pth -o c.png 2>&1 | grep -E "Elapsed|Maximum resident|error|ERROR" || true
          ls -la *.png; python3 -c "import struct;[print(f, struct.unpack('>II', open(f,'rb').read()[16:24])) for f in ['a.png','b.png','c.png']]" || true
      - uses: actions/upload-artifact@v4
        with: { name: probe, path: /mnt/m/*.png }
